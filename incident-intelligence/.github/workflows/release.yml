name: release
on:
  push:
    tags: ["v*"]
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f deployment/docker/Dockerfile -t rfii:${GITHUB_REF_NAME} .
      - uses: anchore/sbom-action@v0.17.2
        with: {image: "rfii:${{ github.ref_name }}", output-file: "rfii-${{ github.ref_name }}.spdx.json"}
      - run: python scripts/build_release_manifest.py --version "${GITHUB_REF_NAME}" --output release-manifest.json
      - run: sha256sum rfii-*.spdx.json release-manifest.json > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with: {files: "rfii-*.spdx.json\nrelease-manifest.json\nSHA256SUMS"}
