[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-fleet-incident-intelligence"
version = "0.1.0"
description = "Read-only historical robot incident diagnostic platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=41,<46",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
test = ["hypothesis>=6.100,<7", "httpx>=0.28,<1", "playwright>=1.49,<2", "pytest>=8,<9", "pytest-cov>=5,<7", "pytest-playwright>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*", "connectors*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
