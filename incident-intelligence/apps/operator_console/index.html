<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Robot Fleet Incident Intelligence</title>
  <style>
    :root{color-scheme:dark;--bg:#07111d;--panel:#102033;--panel2:#152a40;--line:#31506d;--text:#edf5fb;--muted:#abc0d2;--accent:#55e0ad;--warn:#ffd166;--danger:#ff7b7b;--focus:#8ecae6}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}a{color:var(--focus)}header{padding:1rem 2rem;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:1rem;align-items:center}h1{font-size:1.4rem;margin:0}h2,h3{margin-top:.3rem}header p,.muted{color:var(--muted);margin:.2rem 0}.read-only{color:var(--warn)}nav{display:flex;gap:.45rem;padding:.8rem 2rem;border-bottom:1px solid var(--line);overflow:auto;position:sticky;top:0;background:var(--bg);z-index:2}button,.button,input,select,textarea{font:inherit}button,.button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:.45rem;padding:.55rem .8rem;cursor:pointer;text-decoration:none;display:inline-block}button:hover,button.active,.button:hover{border-color:var(--accent);color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button.primary{background:var(--accent);color:#04130e;border-color:var(--accent);font-weight:700}button.danger{border-color:var(--danger)}button[disabled]{opacity:.5;cursor:not-allowed}main{padding:1.4rem 2rem;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}.metrics{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:1rem}.card{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:1rem;margin-bottom:1rem}.nested{background:var(--panel2)}.metric strong{display:block;font-size:1.8rem;color:var(--accent)}label{display:block;margin:.65rem 0 .25rem;font-weight:600}input,select,textarea{width:100%;background:#091827;color:var(--text);border:1px solid var(--line);border-radius:.4rem;padding:.6rem}textarea{min-height:6rem}.inline{display:flex;gap:.6rem;align-items:end;flex-wrap:wrap}.inline>*{flex:1;min-width:150px}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}table{width:100%;border-collapse:collapse;margin-top:.8rem}th,td{text-align:left;padding:.65rem;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}.empty{padding:2.5rem;text-align:center;color:var(--muted)}.badge{padding:.18rem .45rem;border-radius:1rem;border:1px solid var(--line);white-space:nowrap}.status{min-height:1.5rem;margin:.5rem 0;color:var(--accent)}.error{color:var(--danger)}.warning{color:var(--warn)}.tabs{display:flex;gap:.4rem;overflow:auto;margin-bottom:1rem}.split{display:grid;grid-template-columns:minmax(180px,1fr) minmax(380px,3fr) minmax(250px,1.3fr);gap:1rem}.scroll{overflow:auto;max-height:65vh}.selected{border-color:var(--accent)}progress{width:100%}.checklist label{font-weight:400}.checklist input{width:auto;margin-right:.4rem}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:.7rem;max-width:700px;width:90%}dialog::backdrop{background:#0009}@media(max-width:900px){.metrics{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}header,main,nav{padding-left:1rem;padding-right:1rem}}
  </style>
</head>
<body>
  <header>
    <div><h1>Incident Console</h1><p>Historical robot incident diagnostics</p></div>
    <div><span class="read-only">Read-only toward operational systems</span><p id="identity" class="muted">Local analyst mode</p></div>
  </header>
  <nav id="nav" aria-label="Primary navigation">
    <button class="active" data-view="overview">Overview</button>
    <button data-view="engagements">Engagements</button>
    <button data-view="upload">Upload &amp; preview</button>
    <button data-view="mapping">Mapping review</button>
    <button data-view="profiles">Mapping profiles</button>
    <button data-view="incidents">Incidents</button>
    <button data-view="validation">Validation</button>
    <button data-view="admin" data-permission="admin">Admin</button>
    <button data-view="login" id="login-nav">Sign in</button>
  </nav>
  <main id="content" tabindex="-1"><div class="empty">Loading incident data…</div></main>
  <div id="live-status" class="sr-only" aria-live="polite"></div>
  <script>
    const content=document.querySelector('#content'), live=document.querySelector('#live-status');
    const permissions={admin:['read','write','upload','approve','admin'],analyst:['read','write','upload'],reviewer:['read','approve'],operator:['read','write'],partner:['read','upload'],viewer:['read']};
    let state={customers:[],sites:[],systems:[],assets:[],engagements:[],incidents:[],role:localStorage.rfiiRole||'analyst',token:localStorage.rfiiToken||'',actor:'local-analyst',dirty:false,currentIncident:null,lastPreview:null,lastRun:null};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const value=id=>document.getElementById(id)?.value?.trim()||'';
    const allowed=p=>(permissions[state.role]||[]).includes(p);
    function announce(message,error=false){live.textContent=message;const el=document.querySelector('#page-status');if(el){el.textContent=message;el.className=error?'status error':'status'}}
    function tokenHeaders(extra={}){return {...extra,...(state.token?{Authorization:`Bearer ${state.token}`}:{'X-Role':state.role,'X-Actor':state.actor})}}
    async function api(path,options={}){const response=await fetch(path,{...options,headers:tokenHeaders({'Content-Type':'application/json',...(options.headers||{})})});if(!response.ok){let detail;try{detail=await response.json()}catch{detail={detail:response.statusText}}throw new Error(JSON.stringify(detail.detail||detail))}return response.headers.get('content-type')?.includes('json')?response.json():response}
    function decodeIdentity(){if(!state.token)return;try{const payload=JSON.parse(atob(state.token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));state.role=payload.role||'viewer';state.actor=payload.sub||state.actor;localStorage.rfiiRole=state.role}catch{state.role='viewer'}}
    function applyRole(){decodeIdentity();document.querySelector('#identity').textContent=`Role: ${state.role}`;document.querySelectorAll('[data-permission]').forEach(el=>el.hidden=!allowed(el.dataset.permission));document.querySelector('#login-nav').textContent=state.token?'Sign out':'Sign in'}
    async function refresh(){try{const [customers,sites,engagements,incidents,systems,assets]=await Promise.all(['/api/v1/customers','/api/v1/sites','/api/v1/diagnostic-engagements','/api/v1/incidents','/api/v1/systems','/api/v1/assets'].map(path=>api(path).catch(()=>({items:[]}))));Object.assign(state,{customers:customers.items||[],sites:sites.items||[],engagements:engagements.items||[],incidents:incidents.items||[],systems:systems.items||[],assets:assets.items||[]});applyRole()}catch(error){announce(`Refresh failed: ${error.message}`,true)}}
    const options=(rows,label='name')=>rows.map(row=>`<option value="${esc(row.id)}">${esc(row[label]||row.title)}</option>`).join('');
    const table=(rows,columns,empty='No records yet.')=>!rows.length?`<div class="empty">${esc(empty)}</div>`:`<div class="scroll"><table><thead><tr>${columns.map(c=>`<th scope="col">${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td>${c[2]?c[2](row):esc(row[c[1]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    function shell(title,body){content.innerHTML=`<h2>${esc(title)}</h2><div id="page-status" class="status" aria-live="polite"></div>${body}`;content.focus();applyRole()}
    async function render(view){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='login')return renderLogin();await refresh();({overview:renderOverview,engagements:renderEngagements,upload:renderUpload,mapping:renderMapping,profiles:renderProfiles,incidents:renderIncidents,validation:renderValidation,admin:renderAdmin}[view]||renderOverview)()}
    function renderOverview(){const open=state.incidents.filter(i=>!['resolved','closed'].includes(i.status)).length,review=state.incidents.filter(i=>i.status==='review').length,downtime=state.incidents.reduce((n,i)=>n+(i.downtime_seconds||0),0);shell('Overview',`<div class="metrics"><div class="card metric"><span>Open incidents</span><strong>${open}</strong></div><div class="card metric"><span>Awaiting review</span><strong>${review}</strong></div><div class="card metric"><span>Engagements</span><strong>${state.engagements.length}</strong></div><div class="card metric"><span>Downtime reviewed</span><strong>${Math.round(downtime/60)} min</strong></div></div><section class="card"><h3>Recent incidents</h3>${incidentTable()}</section>`)}
    function renderLogin(){if(state.token){state.token='';localStorage.removeItem('rfiiToken');applyRole();announce('Signed out');return render('overview')}shell('Sign in',`<form id="login-form" class="card" aria-label="Sign in"><label for="login-email">Email</label><input id="login-email" type="email" autocomplete="username" required><label for="login-password">Password</label><input id="login-password" type="password" autocomplete="current-password" required><div class="actions"><button class="primary">Sign in</button></div></form>`);document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();try{const result=await api('/auth/token',{method:'POST',body:JSON.stringify({email:value('login-email'),password:value('login-password')})});state.token=result.access_token;localStorage.rfiiToken=state.token;applyRole();await render('overview')}catch(error){announce(error.message,true)}}}
    function renderEngagements(){shell('Diagnostic engagements',`<div class="grid"><form id="engagement-form" class="card" data-permission="write"><h3>Guided engagement creation</h3><label for="customer-name">Customer name</label><input id="customer-name" required value="${esc(localStorage.draftCustomer||'')}"><label for="site-name">Site name</label><input id="site-name" required><label for="site-timezone">Site timezone</label><input id="site-timezone" value="UTC" required><label for="engagement-title">Incident/engagement title</label><input id="engagement-title" required><label for="incident-window">Approximate incident window</label><input id="incident-window" placeholder="2026-07-19 09:00–10:00 UTC"><fieldset class="checklist"><legend>Expected sources</legend>${['robot/fleet log','external system log','maintenance ticket','operator note','network/PLC export'].map((item,i)=>`<label><input type="checkbox" name="sources" value="${esc(item)}" ${i<2?'checked':''}>${esc(item)}</label>`).join('')}</fieldset><label for="handling-basis">Privacy/handling basis</label><select id="handling-basis"><option value="synthetic_or_permitted_export">Synthetic or permitted export</option><option value="customer_authorised_diagnostic">Customer-authorised diagnostic</option></select><label for="retention-until">Retention until</label><input id="retention-until" type="datetime-local"><label><input id="permission-confirmed" type="checkbox" required style="width:auto"> Permission and data scope confirmed</label><div class="actions"><button class="primary">Review and create</button></div></form><section class="card"><h3>Existing engagements</h3>${table(state.engagements,[['Title','title'],['Status','status'],['Handling','handling_basis']])}</section></div>`);const form=document.querySelector('#engagement-form');if(form)form.onsubmit=createEngagement;document.querySelectorAll('#engagement-form input').forEach(el=>el.addEventListener('input',()=>{state.dirty=true;localStorage.draftCustomer=value('customer-name')}))}
    async function createEngagement(event){event.preventDefault();if(!allowed('write'))return announce('Your role cannot create engagements',true);const expected=[...document.querySelectorAll('input[name=sources]:checked')].map(i=>i.value);try{announce('Creating customer, site, and engagement…');const customer=await api('/api/v1/customers',{method:'POST',body:JSON.stringify({name:value('customer-name')})});const site=await api('/api/v1/sites',{method:'POST',body:JSON.stringify({customer_id:customer.id,name:value('site-name'),timezone:value('site-timezone')})});const engagement=await api('/api/v1/diagnostic-engagements',{method:'POST',body:JSON.stringify({customer_id:customer.id,site_id:site.id,title:value('engagement-title'),description:`Approximate incident window: ${value('incident-window')}`,handling_basis:value('handling-basis'),retention_until:value('retention-until')||null,intake_checklist:{permission_confirmed:true,expected_sources:expected,incident_window:value('incident-window')}})});state.dirty=false;localStorage.removeItem('draftCustomer');announce(`Created ${engagement.title}`);await render('upload')}catch(error){announce(`Creation failed: ${error.message}`,true)}}
    function renderUpload(){shell('Upload and preview workspace',`<div class="grid"><form id="source-form" class="card" data-permission="write"><h3>1. Register source</h3><label for="upload-engagement">Engagement</label><select id="upload-engagement" required>${options(state.engagements,'title')}</select><label for="source-name">Source name</label><input id="source-name" placeholder="Robot telemetry export" required><label for="source-type">Source type</label><input id="source-type" value="robot_log" required><label for="source-timezone">Timezone</label><input id="source-timezone" value="UTC"><label for="clock-hint">Clock-offset hint (ms)</label><input id="clock-hint" type="number" value="0"><button class="primary">Register source</button></form><form id="upload-form" class="card" data-permission="upload"><h3>2. Preview file</h3><label for="upload-source">Data source</label><select id="upload-source" required><option value="">Register or load a source</option></select><label for="evidence-file">Evidence file</label><input id="evidence-file" type="file" accept=".csv,.json,.jsonl,.log,.txt" required><label for="upload-encoding">Encoding</label><select id="upload-encoding"><option value="">Auto-detect</option><option value="utf-8">UTF-8</option><option value="utf-8-sig">UTF-8 with BOM</option><option value="windows-1252">Windows-1252</option><option value="iso-8859-1">ISO-8859-1</option></select><label for="mapping-yaml">Mapping profile YAML</label><textarea id="mapping-yaml" spellcheck="false" placeholder="timestamp:\n  field: event_time\n  timezone: UTC"></textarea><progress id="upload-progress" value="0" max="100" aria-label="Upload progress"></progress><div class="actions"><button class="primary">Preview—no import</button><button type="button" id="preserve-button" disabled>Preserve file</button><button type="button" id="commit-button" disabled>Commit ingestion</button></div></form><form id="bundle-form" class="card" data-permission="upload"><h3>Optional ZIP evidence bundle</h3><label for="bundle-engagement">Engagement</label><select id="bundle-engagement">${options(state.engagements,'title')}</select><label for="bundle-file">ZIP bundle</label><input id="bundle-file" type="file" accept=".zip" required><p>Traversal, links, encryption, nested archives, and archive bombs are rejected.</p><button>Validate and preserve bundle</button></form></div><section id="preview-panel" class="card"><h3>Preview results</h3><div class="empty">Select a source and file. Preview never commits records.</div></section>`);document.querySelector('#source-form').onsubmit=registerSource;document.querySelector('#upload-engagement').onchange=loadSources;document.querySelector('#upload-form').onsubmit=previewFile;document.querySelector('#preserve-button').onclick=preserveFile;document.querySelector('#commit-button').onclick=commitFile;document.querySelector('#bundle-form').onsubmit=uploadBundle;loadSources()}
    async function loadSources(){const id=value('upload-engagement');if(!id)return;try{const result=await api(`/api/v1/diagnostic-engagements/${id}/sources`);document.querySelector('#upload-source').innerHTML=result.items.map(item=>`<option value="${esc(item.id)}">${esc(item.name)} — ${esc(item.source_type)}</option>`).join('')}catch(error){announce(error.message,true)}}
    async function registerSource(event){event.preventDefault();try{await api(`/api/v1/diagnostic-engagements/${value('upload-engagement')}/sources`,{method:'POST',body:JSON.stringify({name:value('source-name'),source_type:value('source-type'),timezone:value('source-timezone'),clock_offset_ms:Number(value('clock-hint')||0),expected:true})});announce('Source registered');await loadSources()}catch(error){announce(error.message,true)}}
    function uploadBody(){const body=new FormData();body.append('file',document.querySelector('#evidence-file').files[0]);body.append('mapping_yaml',value('mapping-yaml'));body.append('encoding',value('upload-encoding'));return body}
    async function multipart(path,body){const response=await fetch(path,{method:'POST',headers:tokenHeaders(),body});if(!response.ok)throw new Error(JSON.stringify((await response.json()).detail));return response.json()}
    async function uploadBundle(event){event.preventDefault();const body=new FormData();body.append('file',document.querySelector('#bundle-file').files[0]);try{announce('Validating and preserving evidence bundle…');const result=await multipart(`/api/v1/diagnostic-engagements/${value('bundle-engagement')}/bundles`,body);announce(`Bundle preserved: ${result.files.length} files, SHA-256 ${result.archive_sha256}`)}catch(error){announce(`Bundle rejected: ${error.message}`,true)}}
    async function previewFile(event){event.preventDefault();try{announce('Profiling file…');const result=await multipart(`/api/v1/sources/${value('upload-source')}/uploads/preview`,uploadBody());state.lastPreview=result;document.querySelector('#preserve-button').disabled=false;renderPreview(result);announce('Preview complete; review before preserving')}catch(error){announce(error.message,true)}}
    function renderPreview(result){document.querySelector('#preview-panel').innerHTML=`<h3>Preview results</h3><div class="metrics"><div class="card nested"><b>Format</b><p>${esc(result.format)}</p></div><div class="card nested"><b>Records</b><p>${esc(result.total_records)}</p></div><div class="card nested"><b>Errors</b><p>${esc(result.validation_errors.length)}</p></div><div class="card nested"><b>Unknown codes</b><p>${esc(result.unknown_event_codes.length)}</p></div></div><h4>Detected columns</h4><p>${result.columns.map(c=>`<span class="badge">${esc(c)}</span>`).join(' ')}</p><h4>Timestamp/row errors</h4><button type="button" onclick="downloadRowErrors()" ${result.validation_errors.length?'':'disabled'}>Download row-error CSV</button>${table(result.validation_errors,[['Line','line'],['Field','field'],['Error','error']],'No validation errors.')}<h4>Proposed asset mappings</h4>${table(result.proposed_asset_mappings,[['External ID','external_asset_id'],['Status','status'],['Asset','asset_id']],'No identifiers proposed.')}<h4>Sample rows</h4><pre class="scroll">${esc(JSON.stringify(result.sample_records,null,2))}</pre>`}
    function downloadRowErrors(){const rows=(state.lastPreview||{}).validation_errors||[];const quote=value=>`"${String(value??'').replaceAll('"','""')}"`;const csv=['line,field,error',...rows.map(row=>[row.line,row.field,row.error].map(quote).join(','))].join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='ingestion-row-errors.csv';link.click();URL.revokeObjectURL(link.href)}
    async function preserveFile(){try{announce('Preserving original bytes…');const result=await multipart(`/api/v1/sources/${value('upload-source')}/uploads`,uploadBody());state.lastRun=result;document.querySelector('#commit-button').disabled=false;document.querySelector('#upload-progress').value=100;announce(`Preserved file ${result.source_filename}; explicit commit still required`)}catch(error){announce(error.message,true)}}
    async function commitFile(){if(!state.lastRun)return;try{announce('Committing raw records and normalizing events…');const result=await api(`/api/v1/ingestion-runs/${state.lastRun.id}/commit`,{method:'POST',body:'{}'});document.querySelector('#commit-button').disabled=true;announce(`Committed ${result.raw_records_created} raw records and ${result.events_normalized} events`)}catch(error){announce(error.message,true)}}
    function renderMapping(){shell('Asset and system mapping review',`<div class="grid"><form id="mapping-form" class="card" data-permission="write"><h3>Record mapping decision</h3><label for="mapping-engagement">Engagement</label><select id="mapping-engagement">${options(state.engagements,'title')}</select><label for="external-identifier">External identifier</label><input id="external-identifier" required><label for="mapping-asset">Assign asset</label><select id="mapping-asset"><option value="">Leave unresolved</option>${options(state.assets)}</select><label for="mapping-method">Match method</label><select id="mapping-method"><option>analyst_confirmation</option><option>exact</option><option>alias</option><option>configured_rule</option><option>unresolved</option></select><label for="mapping-rationale">Why this match was selected</label><textarea id="mapping-rationale" required></textarea><button class="primary">Save audited decision</button></form><section class="card"><h3>Create missing asset</h3><form id="asset-form" data-permission="write"><label for="asset-site">Site</label><select id="asset-site">${options(state.sites)}</select><label for="asset-name">Name</label><input id="asset-name" required><label for="asset-external">External ID</label><input id="asset-external"><label for="asset-type">Type</label><input id="asset-type" value="unknown"><button>Create asset</button></form><h3>Known assets</h3>${table(state.assets,[['Name','name'],['External ID','external_asset_id'],['Aliases','aliases',r=>esc((r.aliases||[]).join(', '))]])}</section></div><section id="mapping-history" class="card"><h3>Mapping history</h3></section>`);document.querySelector('#mapping-form').onsubmit=saveMapping;document.querySelector('#asset-form').onsubmit=createAsset;document.querySelector('#mapping-engagement').onchange=loadMappingHistory;loadMappingHistory()}
    async function saveMapping(event){event.preventDefault();const asset=value('mapping-asset');try{await api('/api/v1/asset-mappings',{method:'POST',body:JSON.stringify({engagement_id:value('mapping-engagement'),external_identifier:value('external-identifier'),target_type:asset?'asset':'unresolved',asset_id:asset||null,system_id:null,match_method:asset?value('mapping-method'):'unresolved',rationale:value('mapping-rationale')})});announce('Mapping decision saved and audited');await refresh();loadMappingHistory()}catch(error){announce(error.message,true)}}
    async function createAsset(event){event.preventDefault();try{await api('/api/v1/assets',{method:'POST',body:JSON.stringify({site_id:value('asset-site'),name:value('asset-name'),asset_type:value('asset-type'),external_asset_id:value('asset-external')||null,aliases:[],metadata:{created_from:'mapping_review'}})});announce('Asset created');await render('mapping')}catch(error){announce(error.message,true)}}
    async function loadMappingHistory(){const id=value('mapping-engagement');if(!id)return;try{const result=await api(`/api/v1/diagnostic-engagements/${id}/asset-mappings`);document.querySelector('#mapping-history').innerHTML=`<h3>Mapping history</h3>${table(result.items,[['External ID','external_identifier'],['Method','match_method'],['Asset','asset_id'],['Rationale','rationale']])}`}catch(error){announce(error.message,true)}}
    function incidentTable(){return table(state.incidents,[['Incident','title'],['Status','status',r=>`<span class="badge">${esc(r.status)}</span>`],['Impact','business_impact'],['Action','id',r=>`<button onclick="openIncident('${esc(r.id)}')">Investigate</button>`]],'No incidents yet.')}
    function renderIncidents(){shell('Incidents',`<div class="grid"><form id="incident-form" class="card" data-permission="write"><h3>Create incident</h3><label for="incident-engagement">Engagement</label><select id="incident-engagement">${options(state.engagements,'title')}</select><label for="incident-site">Site</label><select id="incident-site">${options(state.sites)}</select><label for="incident-title">Title</label><input id="incident-title" required><label for="incident-start">Started at</label><input id="incident-start" type="datetime-local" required><label for="incident-recovered">Recovered at</label><input id="incident-recovered" type="datetime-local"><label for="incident-impact">Business impact</label><textarea id="incident-impact"></textarea><button class="primary">Create incident</button></form><section class="card"><h3>Incident queue</h3>${incidentTable()}</section></div>`);document.querySelector('#incident-form').onsubmit=createIncident}
    async function createIncident(event){event.preventDefault();try{await api('/api/v1/incidents',{method:'POST',body:JSON.stringify({diagnostic_engagement_id:value('incident-engagement'),site_id:value('incident-site'),title:value('incident-title'),started_at:new Date(value('incident-start')).toISOString(),recovered_at:value('incident-recovered')?new Date(value('incident-recovered')).toISOString():null,business_impact:value('incident-impact')})});announce('Incident created');await render('incidents')}catch(error){announce(error.message,true)}}

    function workspaceTimeline(){const rows=state.workspace.timeline;document.querySelector('#workspace-panel').innerHTML=`<div class="split"><aside class="card"><h3>Filters</h3><label for="timeline-search">Search</label><input id="timeline-search"><label for="timeline-severity">Severity</label><select id="timeline-severity"><option value="">All</option>${['info','warning','error','critical','unknown'].map(x=>`<option>${x}</option>`).join('')}</select><button onclick="filterTimeline()">Apply filters</button><h3>Boundaries</h3><form id="boundary-form" data-permission="write"><label for="boundary-start">Start</label><input id="boundary-start" type="datetime-local" required><label for="boundary-end">Recovery</label><input id="boundary-end" type="datetime-local"><label for="boundary-reason">Reason</label><input id="boundary-reason" required><button>Save boundaries</button></form><h3>Clock offset</h3><form id="offset-form" data-permission="write"><label for="offset-source">Source</label><select id="offset-source"></select><label for="offset-ms">Offset ms</label><input id="offset-ms" type="number" value="0"><label for="offset-reason">Evidence/reason</label><input id="offset-reason" required><button>Recalculate</button></form></aside><section class="card"><h3>Chronological timeline</h3><div id="timeline-table">${timelineTable(rows)}</div><form id="annotation-form" data-permission="write"><h4>Add annotation</h4><div class="inline"><div><label for="annotation-time">Time</label><input id="annotation-time" type="datetime-local" required></div><div><label for="annotation-title">Title</label><input id="annotation-title" required></div></div><label for="annotation-note">Analyst note</label><textarea id="annotation-note"></textarea><button>Add annotation</button></form></section><aside id="event-detail" class="card"><h3>Event details</h3><p>Select an event to inspect provenance and raw evidence.</p></aside></div>`;document.querySelector('#boundary-form').onsubmit=saveBoundaries;do     function renderAdmin(){if(!allowed('admin'))return shell('Admin','<div class="error">Administrator role required.</div>');shell('Admin',`<section class="card"><h3>Create user</h3><form id="user-form"><label for="user-email">Email</label><input id="user-email" type="email" required><label for="user-password">Temporary password (12+ characters)</label><input id="user-password" type="password" minlength="12" required><label for="user-role">Role</label><select id="user-role">${Object.keys(permissions).map(x=>`<option>${x}</option>`).join('')}</select><button>Create user</button></form></section>`);document.querySelector('#user-form').onsubmit=saveUser}
    async function saveUser(e){e.preventDefault();await api('/auth/users',{method:'POST',body:JSON.stringify({email:value('user-email'),password:value('user-password'),role_name:value('user-role')})});announce('User created')}
    async function renderProfiles(){let profiles={items:[]};try{profiles=await api('/api/v1/mapping-profiles')}catch(error){announce(error.message,true)}shell('Versioned mapping profiles',`<div class="grid"><form id="profile-form" class="card" data-permission="write"><h3>Create a new immutable version</h3><label for="profile-name">Profile name</label><input id="profile-name" required><label for="profile-version">Version</label><input id="profile-version" value="1.0" required><label for="profile-source-type">Source type</label><input id="profile-source-type" required><label for="profile-yaml">Constrained profile YAML</label><textarea id="profile-yaml" spellcheck="false" required>timestamp:\n  field: event_time\n  timezone: UTC\nfields:\n  event_code: event_code\n  message: message\nasset_mapping:\n  external_asset_id_field: asset_id</textarea><label for="profile-fixture">Test fixture reference</label><input id="profile-fixture"><label for="profile-notes">Compatibility notes</label><textarea id="profile-notes"></textarea><button class="primary">Save new profile version</button><p>No arbitrary code is accepted; profiles are declarative mappings only.</p></form><section class="card"><h3>Profile versions</h3>${table(profiles.items,[['Name','name'],['Version','version'],['Source type','source_type'],['Author','author'],['Notes','compatibility_notes']])}</section></div>`);document.querySelector('#profile-form').onsubmit=saveProfile;applyRole()}
    async function saveProfile(e){e.preventDefault();try{const profile=jsyamlSafe(value('profile-yaml'));await api('/api/v1/mapping-profiles',{method:'POST',body:JSON.stringify({name:value('profile-name'),version:value('profile-version'),source_type:value('profile-source-type'),profile,test_fixture:value('profile-fixture')||null,compatibility_notes:value('profile-notes')})});announce('Immutable profile version saved');renderProfiles()}catch(error){announce(`Profile not saved: ${error.message}`,true)}}
    function jsyamlSafe(text){const result={};let section=result;for(const raw of text.split('\n')){if(!raw.trim()||raw.trim().startsWith('#'))continue;const indent=raw.length-raw.trimStart().length;const [key,...parts]=raw.trim().split(':');const val=parts.join(':').trim();if(!key)throw new Error('Invalid YAML line');if(!indent){if(!val){result[key]={};section=result[key]}else{result[key]=val;section=result}}else{section[key]=val}}return result}
    document.querySelector('#nav').addEventListener('click',e=>{if(e.target.dataset.view)render(e.target.dataset.view)});
    window.addEventListener('beforeunload',e=>{if(state.dirty){e.preventDefault();e.returnValue=''}});
    applyRole();render('overview');
  </script>
</body>
</html>
