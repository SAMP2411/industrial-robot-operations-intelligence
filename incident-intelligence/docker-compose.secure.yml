services:
  api:
    ports: !reset []
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  worker:
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  db:
    ports: !reset []
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2.8.4-alpine
    ports: ["443:443", "80:80"]
    environment:
      RFII_HOSTNAME: ${RFII_HOSTNAME:?set RFII_HOSTNAME}
    volumes:
      - ./deployment/on_prem/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RFII_TLS_CERT_DIR:-./deployment/on_prem/certs}:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
volumes:
  caddy_data:
  caddy_config:
